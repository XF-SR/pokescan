name: Base du scanner
on:
  schedule:
    - cron: "41 2 * * 1"   # chaque lundi : ajoute les nouvelles cartes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests numpy pillow
      - run: python tools/build_db.py
      - name: Enregistrer
        run: |
          git config user.name "pokescan-bot"
          git config user.email "pokescan-bot@users.noreply.github.com"
          git add db
          git commit -m "Base du scanner $(date +%F)" || echo "rien de nouveau"
          git pull --rebase && git push
